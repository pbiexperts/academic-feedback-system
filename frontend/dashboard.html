<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - SAFAS</title>
  <meta name="description" content="SAFAS institutional dashboard for academic feedback and analytics.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <div class="wrapper">
    <!-- Sidebar -->
    <nav id="sidebar">
      <div class="sidebar-header">
        <i class="bi bi-mortarboard-fill me-2"></i> SAFAS
      </div>
      <div class="sidebar-menu">
        <ul id="sidebarMenu">
          <!-- Populated by JS based on role -->
          <li data-role="program_coordinator"><a href="#attendance" class="nav-item" id="nav-attendance">Attendance Mgmt</a></li>
          <li data-role="program_coordinator"><a href="#students" class="nav-item" id="nav-students">Students & Upload</a></li>
        </ul>
      </div>
      <div class="p-3 mt-auto" style="border-top: 1px solid rgba(255,255,255,0.08);">
        <small style="color: rgba(255,255,255,0.4);">&copy; 2026 SAFAS v1.0</small>
      </div>
    </nav>

    <!-- Main Content -->
    <div id="content">
      <!-- Header -->
      <header class="main-header">
        <div>
          <button id="sidebarToggle" class="btn btn-light d-md-none"><i class="bi bi-list"></i></button>
        </div>
        
        <div class="dropdown">
          <div class="user-profile dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle"></i>
            <div>
              <div id="userName" class="fw-semibold" style="font-size: 0.85rem; line-height: 1.2;">User</div>
              <small id="userRole" class="text-muted" style="font-size: 0.72rem;">Role</small>
              <small id="studentProfileBadge" class="text-muted d-block" style="font-size: 0.68rem;"></small>
            </div>
          </div>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
          </ul>
        </div>
      </header>

      <!-- Dynamic Page Content -->
      <main class="page-content" id="mainContent">
        <div class="d-flex justify-content-center align-items-center" style="min-height: 300px;">
          <div class="text-center">
            <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted">Loading dashboard...</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <!-- Global Modal -->
  <div class="modal fade" id="globalModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="globalModalTitle">Modal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="globalModalBody"></div>
        <div class="modal-footer" id="globalModalFooter">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
