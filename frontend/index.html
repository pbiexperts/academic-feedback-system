<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFAS - Smart Academic Feedback & Analytics System</title>
  <meta name="description" content="Secure, confidential academic feedback platform for institutional use.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="login-card">
          <div class="login-header">
            <div class="login-logo">
              <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h1>SAFAS</h1>
            <p class="text-muted mb-0">Smart Academic Feedback &amp; Analytics System</p>
          </div>
          
          <form id="loginForm">
            <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
            
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" required placeholder="name@institution.edu" autocomplete="email">
              </div>
            </div>
            
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" required autocomplete="current-password">
              </div>
            </div>

            <div class="text-end mb-3">
              <a href="#" id="forgotPasswordLink" class="text-decoration-none small">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn btn-primary-custom w-100 py-2" id="loginBtn">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </form>
          
          <div class="text-center mt-4">
            <small class="text-muted">&copy; 2026 SAFAS Institutional Platform</small>
          </div>

          <!-- Demo credentials panel -->
          <div class="demo-credentials mt-3">
            <div class="text-center mb-2">
              <small class="text-muted fw-bold"><i class="bi bi-info-circle me-1"></i>Demo Credentials</small>
            </div>
            <div class="d-flex flex-wrap gap-1 justify-content-center">
              <button class="btn btn-sm btn-outline-secondary demo-login" data-email="admin@safas.edu" data-pass="admin123">Admin</button>
              <button class="btn btn-sm btn-outline-secondary demo-login" data-email="dean@safas.edu" data-pass="dean123">Dean</button>
              <button class="btn btn-sm btn-outline-secondary demo-login" data-email="hod.cs@safas.edu" data-pass="hod123">HOD</button>
              <button class="btn btn-sm btn-outline-secondary demo-login" data-email="pc.cs@safas.edu" data-pass="pc123">Program Coordinator</button>
              <button class="btn btn-sm btn-outline-secondary demo-login" data-email="faculty1.cs@safas.edu" data-pass="faculty123">Faculty</button>
              <button class="btn btn-sm btn-outline-secondary demo-login" data-email="student1@safas.edu" data-pass="student123">Student</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 bg-light">
          <h5 class="modal-title"><i class="bi bi-key-fill me-2 text-primary"></i>Reset Your Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="forgotPasswordError" class="alert alert-danger d-none" role="alert"></div>
          <div id="forgotPasswordSuccess" class="alert alert-success d-none" role="alert"></div>
          
          <form id="forgotPasswordForm">
            <div class="mb-3">
              <label for="forgotEmail" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="forgotEmail" required placeholder="your.email@institution.edu">
            </div>
            <div class="mb-3">
              <label for="forgotPhone" class="form-label">Registered Phone Number</label>
              <input type="tel" class="form-control" id="forgotPhone" required placeholder="+91-98765-43210">
              <small class="text-muted">Enter your registered phone number for verification</small>
            </div>
            <div class="mb-3">
              <label for="forgotNewPassword" class="form-label">New Password</label>
              <input type="password" class="form-control" id="forgotNewPassword" required placeholder="At least 8 characters">
              <small class="text-muted">Password must be at least 8 characters long</small>
            </div>
          </form>
        </div>
        <div class="modal-footer border-0 bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="resetPasswordBtn" onclick="submitForgotPassword()">Reset Password</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Forgot password modal handler
    let forgotPasswordModal = null;
    
    document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
      e.preventDefault();
      forgotPasswordModal = new bootstrap.Modal(document.getElementById('forgotPasswordModal'));
      document.getElementById('forgotPasswordForm').reset();
      document.getElementById('forgotPasswordError').classList.add('d-none');
      document.getElementById('forgotPasswordSuccess').classList.add('d-none');
      forgotPasswordModal.show();
    });

    async function submitForgotPassword() {
      const email = document.getElementById('forgotEmail').value.trim();
      const phone_no = document.getElementById('forgotPhone').value.trim();
      const new_password = document.getElementById('forgotNewPassword').value.trim();
      const errorDiv = document.getElementById('forgotPasswordError');
      const successDiv = document.getElementById('forgotPasswordSuccess');
      const btn = document.getElementById('resetPasswordBtn');

      errorDiv.classList.add('d-none');
      successDiv.classList.add('d-none');

      if (!email || !phone_no || !new_password) {
        errorDiv.textContent = 'All fields are required.';
        errorDiv.classList.remove('d-none');
        return;
      }

      if (new_password.length < 8) {
        errorDiv.textContent = 'Password must be at least 8 characters long.';
        errorDiv.classList.remove('d-none');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing...';

      try {
        const response = await fetch('http://localhost:8000/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, phone_no, new_password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Password reset failed. Please check your email and phone number.');
        }

        successDiv.innerHTML = '<i class="bi bi-check-circle me-2"></i><strong>Success!</strong> Your password has been reset. You can now log in with your new password.';
        successDiv.classList.remove('d-none');
        document.getElementById('forgotPasswordForm').reset();

        setTimeout(() => {
          forgotPasswordModal.hide();
        }, 2000);
      } catch (err) {
        errorDiv.textContent = err.message || 'An error occurred. Please try again.';
        errorDiv.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Reset Password';
      }
    }
    // Redirect if already logged in
    if (localStorage.getItem('safas_token')) {
      window.location.href = 'dashboard.html';
    }

    async function performLogin(email, password) {
      const btn = document.getElementById('loginBtn');
      const errorDiv = document.getElementById('loginError');
      
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Signing in...';
      errorDiv.classList.add('d-none');

      try {
        const tokenResponse = await api.login(email, password);
        localStorage.setItem('safas_token', tokenResponse.access_token);
        
        // Fetch user profile with the token
        const userProfile = await api.get('/auth/me');
        localStorage.setItem('safas_user', JSON.stringify(userProfile));
        
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorDiv.textContent = err.message || 'Login failed. Please check credentials.';
        errorDiv.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      await performLogin(email, password);
    });

    // Demo login buttons
    document.querySelectorAll('.demo-login').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const email = e.target.dataset.email;
        const pass = e.target.dataset.pass;
        document.getElementById('email').value = email;
        document.getElementById('password').value = pass;
        await performLogin(email, pass);
      });
    });
  </script>
</body>
</html>
